<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* load font from local fonts directory format is ttf.
   Jura-VariableFont_wght.ttf
      */
      @font-face {
        font-family: "Baloo";
        src: url("./fonts/Baloo_2/Baloo2-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      /* load other font weights */
      @font-face {
        font-family: "Baloo";
        src: url("./fonts/Baloo_2/Baloo2-Bold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: "Baloo";
        src: url("./fonts/Baloo_2/Baloo2-SemiBold.ttf") format("truetype");
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: "Baloo";
        src: url("./fonts/Baloo_2/Baloo2-Medium.ttf") format("truetype");
        font-weight: 500;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      .container {
        position: relative;
        background-image: url("./text-bg.png");
        width: 100%;
        height: 100vh;
        background-size: cover;
        background-position: center;

        font-family: "Baloo", sans-serif;
      }

      .word-card {
        position: absolute;
        top: 30%;
        left: 15%;

        color: #303030;

        display: flex;
        flex-direction: column;
        gap: 0.5vh;

        .word {
          font-size: 7vh;
          font-weight: 600;
        }

        .detail {
          max-width: 800px;
          display: flex;
          flex-direction: column;
          font-size: 4vh;
          gap: 0.5vh;
          letter-spacing: -0.1vh;

          .pos {
            color: #606060;
            font-size: 3vh;
            font-weight: 500;
          }
          .definition {
            font-weight: 500;
          }

          .sentence {
            font-weight: lighter;
            font-size: 3vh;
            color: #585858;
          }
        }
      }

      .mark {
        position: absolute;
        bottom: 5%;
        right: 50%;
        transform: translateX(50%);

        font-size: 2vh;
        color: #909090;
      }
    </style>
  </head>
  <body>
    <div id="container" class="container">
      <div class="word-card">
        <span class="word"></span>
        <div class="detail">
          <span class="pos"></span>
          <span class="definition"></span>
          <p class="sentence">
            <span class="sentence"></span>
          </p>
        </div>
      </div>
      <div class="mark">
        <p class="mark">english.aliving.app</p>
      </div>
    </div>
  </body>
</html>
