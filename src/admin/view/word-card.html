<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* load font from local fonts directory format is ttf.
      Jura-VariableFont_wght.ttf
         */
      @font-face {
        font-family: "Baloo";
        src: url("./fonts/Baloo_2/Baloo2-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      /* load other font weights */
      @font-face {
        font-family: "Baloo";
        src: url("./fonts/Baloo_2/Baloo2-Bold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
      }
      @font-face {
        font-family: "Baloo";
        src: url("./fonts/Baloo_2/Baloo2-SemiBold.ttf") format("truetype");
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: "Baloo";
        src: url("./fonts/Baloo_2/Baloo2-Medium.ttf") format("truetype");
        font-weight: 500;
        font-style: normal;
      }

      @font-face {
        font-family: "customarial";
        src: url("./fonts/arial.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      body {
        font-size: 16px;
      }

      .container {
        position: relative;
        width: 100%;
        height: 100vh;
        background-size: cover;
        background-position: center;
        padding: 3rem 2rem;

        font-family: "Baloo", sans-serif;

        color: #3d4a53;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-evenly;
        /* gap: 2rem; */
        /* horizontal alignment for children elements */

        .word {
          font-size: 8rem;
          letter-spacing: -0.25rem;
          line-height: 0.7;
          font-weight: 600;
          color: #2b7fff;
        }
        .definition {
          font-size: 4rem;
          letter-spacing: -0.2rem;
          line-height: 4.3rem;
          text-align: center;
        }
        .img {
          width: 100%;
          height: 30rem;
          background-image: none; /* Set dynamically from script */
          background-position: center;
          background-size: contain;
          background-repeat: no-repeat;
          margin-top: 1rem;
        }
        .sentence-container {
          /* flex-grow: 1; */
          /* align horizontal */
          display: flex;
          justify-content: center;
          align-items: center;
        }
        .sentence {
          font-size: 4.5rem;
          letter-spacing: -0.15rem;
          line-height: 4.5rem;
          margin-bottom: 20px;
          /* word-spacing: -0.15rem; */
          text-align: center;
          font-family: "customarial", sans-serif;

          span {
            display: inline-block;
            /* background-color: #ff53d9; */
            background-color: #ff53da45;

            border-radius: 1rem;
            padding: 0.5rem 0.7rem;
            /* line-height: 5rem; */
          }
        }
        .mark {
          color: #767676;
          font-size: 2.5rem;
          letter-spacing: 0.1rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="container" class="container">
      <p class="word">document</p>
      <p class="definition">
        a piece of written or electronic file that provides information
      </p>
      <div class="img"></div>
      <div class="sentence-container">
        <p class="sentence">
          Hard work is the key to the <span>success</span> of any goal.
        </p>
      </div>
      <p class="mark">english.aliving.app</p>
    </div>
  </body>
</html>
